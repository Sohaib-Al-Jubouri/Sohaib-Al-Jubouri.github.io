name: Replace index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace index.html with uploaded file
        run: |
          git config user.name "Sohaib-Al-Jubouri"
          git config user.email "suhaib.pilot@gmail.com"
          mv personal-website.html index.html
          git add -A
          git status --short
          git commit -m "Replace index.html with updated personal website"
          git push
