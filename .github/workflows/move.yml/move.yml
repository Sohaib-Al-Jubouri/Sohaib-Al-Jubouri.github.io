name: Move personal-website to index

on:
  push:
    branches: [main]
    paths:
      - personal-website.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy personal-website.html over index.html
        run: cp personal-website.html index.html
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html from personal-website.html"
          git push
